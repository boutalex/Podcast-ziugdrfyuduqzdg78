name: Podcast quotidien
on:
  schedule:
    - cron: "30 5 * * *"   # 05:30 UTC (≈ 6h30-7h30 à Paris)
  workflow_dispatch:        # lancement manuel pour tester
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les épisodes précédents
        run: |
          mkdir -p site
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git archive origin/gh-pages | tar -x -C site
          fi
      - run: pip install google-genai feedparser trafilatura edge-tts
      - name: Générer l'épisode
        run: python podcast.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Publier sur GitHub Pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "podcast-bot"
          git config user.email "podcast-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Épisode $(date +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
